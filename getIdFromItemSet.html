    <script type="module">
        import {auth} from './modules/auth.js';
        import {pa} from './modules/authParams.js';

        let curwait=0, hot, a = new auth(pa), dataItemSet = [], dataCsv = [], dataResult = [],
            hots = [
                {'id':'csv','title':"Données du CSV",'data':dataCsv, 'cont':d3.select("#hotCsv")},
                {'id':'is','title':"Données de l'ItemSet",'data':dataItemSet, 'cont':d3.select("#hotItemSet1")},
                {'id':'rs','title':"Résultat du calcul",'data':dataResult, 'cont':d3.select("#hotResult")},
            ];

        a.getUser(u=>{
            console.log(u);
            a.omk.setItemSets(data=>{                                                
                if(data.length){
                    //récupère les item sets
                    dataItemSet = data.map(d=>{
                        return {
                            'id':d['o:id'],
                            'name':d['o:title'],
                            'path':d['o:resource_url']
                            };
                        });

                    setMenu('#ddItemSet',dataItemSet,'name',getItemSet);
                }else{
                    d3.select('#selectExport').html('Aucun item set trouvé');
                    d3.select('#ddItemSet').remove();
                }
            });
        });


        //événement de changement du fichier    
        document.getElementById('formFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const contents = evt.target.result;
                dataCsv = d3.csvParse(contents);
                setTable('csv',dataCsv);
            };
            reader.readAsText(file);
        });


        function getItemSet(e,d){
            //récupère le tableur 
            //récupère l'item set
            if(d3.select('#collapseIT'+d.id).size()==0){
                let title = "Items de l'ItemSet : "+d.name,
                    html = `
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseIT${d.id}" aria-expanded="true" aria-controls="collapseIT${d.id}">
                                ${title}
                            </button>
                        </h2>
                        <div id="collapseIT${d.id}" class="accordion-collapse collapse show" data-bs-parent="#accordionItemSets">
                            <div class="accordion-body">
                                <div id="hotItemSet${d.id}" ></div>                            
                            </div>
                        </div>`;
                //ajoute un item dans l'accordion
                d3.select('#accordionItemSets').append('div').attr("class","accordion-item").html(html);
                hots.push({'id':'is'+d.id,'title':title,'data':[],'cont':d3.select("#hotItemSet"+d.id)});
                //récupère les items de l'item set
                a.omk.getAllItems("item_set_id="+d.id,items=>{
                    if(items.length){
                        hots.find(h=>h.id=='is'+d.id).data = items.map(d=>{
                            return {
                                'id':d['o:id'],
                                'name':d['o:title'],
                                };
                            });
                        setTable('is'+d.id);
                    }else{
                        d3.select('#mainContent').html('<h2>Aucun item trouvé dans cet item set</h2>');
                    }
                });
            }
        }

        function setMenu(s,data,lbl,fct){
            d3.select(s).selectAll('li').data(data)
            .join(
                enter => enter.append('li')
                    .append('a').attr('class',"dropdown-item")
                    .html(d=>d[lbl])
                    .on('click',fct),
                update => update.select('a').html(d=>d[lbl]),
                exit => exit.remove()
            );
        }


        function showItems(items,i){
            console.log(items);
        }

        function exportData(e,d){
            showLoader();
            switch (d.id) {
                case 1:
                    const exportPlugin = hot.getPlugin('exportFile');
                    exportPlugin.downloadFile('csv', {
                        bom: false,
                        columnDelimiter: ',',
                        columnHeaders: true,
                        exportHiddenColumns: true,
                        exportHiddenRows: true,
                        fileExtension: 'csv',
                        filename: 'githubStats_'+a.loginGitHub+'[YYYY]-[MM]-[DD]',
                        mimeType: 'text/csv',
                        rowDelimiter: '\r\n',
                        rowHeaders: true
                    });                    
                    break;            
                case 2:
                    let mContrib = groups.contributors.map(c=>{
                    return {
                        'o:resource_class':'jdc:Actant',
                        'dcterms:identifier':c.id,
                        'foaf:account':c.login,
                        'dcterms:title':'GitHub '+c.type+' : '+c.login,
                        'schema:provider ^^resource':'GitHub',
                        'foaf:accountServiceHomepage ^^uri':c.html_url,
                        'Media url':c.avatar_url
                        }
                    });
                    exportCSVFile(Object.keys(mContrib[0]),mContrib,'githubStats_'+a.loginGitHub+'_contributors');
                break;            
                case 4:
                    let mLang = groups.langages.map(l=>{
                    return {
                        'o:resource_class':'skos:Concept',
                        'skos:broader ^^resource':'72015|120165',
                        'skos:prefLabel':l,
                        'dcterms:title':l,
                        }
                    });
                    exportCSVFile(Object.keys(mLang[0]),mLang,'githubStats_'+a.loginGitHub+'_langages');
                break;            
                case 3:
                    let q, rs, nVals, nRow= {}, nData= [], gData = hot.getData(); 
                    gData.forEach(d=>{
                        //calcule les nouvelles valeurs
                        nRow= {};
                        configHeaders.forEach((ch,i)=>{
                            if(ch.e==" ^^resource" && d[i]){
                                //remplace les valeurs textes par les identifiant de resource omk
                                switch (ch.lc) {
                                    case 'schema:provider':
                                        nRow[ch.lc+ch.e]=oidGitHub;    
                                        break;
                                    case 'bibo:contributorList':                                        
                                        nVals = []
                                        d[i].split('|').forEach(r=>{
                                            if(!refs[r]){
                                                    q = 'property[0][property]='
                                                    +a.omk.getPropId('foaf:accountServiceHomepage')
                                                    +'&property[0][type]=eq&property[0][text]=https://github.com/'+r;
                                                rs = a.omk.searchItems(q);
                                                if(rs){
                                                    nVals.push(rs[0]['o:id']);
                                                    refs[r]=rs[0]['o:id'];
                                                }else{
                                                    refs[r]=' ';
                                                    console.log("pas d'identifiant dans omk : "+q);
                                                }     
                                            }else nVals.push(refs[r]);
 
                                        });
                                        nRow[ch.lc+ch.e]=nVals.join('|');    
                                        break;
                                    case 'schema:programmingLanguage':                                        
                                        nVals = []
                                        d[i].split('|').forEach(r=>{
                                            if(!refs[r]){
                                                    q = 'property[0][property]='+a.omk.getPropId('skos:altLabel')
                                                    +'&property[0][type]=eq&property[0][text]='+r
                                                    +'&property[1][property]='+a.omk.getPropId('skos:broader')
                                                    +'&property[1][type]=res&property[1][text]=72015'
                                                    +'&property[2][property]='+a.omk.getPropId('skos:broader')
                                                    +'&property[2][type]=res&property[2][text]=120165';
                                                rs = a.omk.searchItems(q);
                                                if(rs.length){
                                                    nVals.push(rs[0]['o:id']);
                                                    refs[r]=rs[0]['o:id'];
                                                }else{
                                                    refs[r]=' ';
                                                    console.log("pas d'identifiant dans omk : "+q);
                                                }     
                                            }else nVals.push(refs[r]);
 
                                        });
                                        nRow[ch.lc+ch.e]=nVals.join('|');    
                                        break;
                                }                                
                            }else nRow[ch.lc+ch.e]=d[i];
                        })
                        nData.push(nRow);
                    })
                    exportCSVFile(Object.keys(nData[0]),nData,'githubStats_'+a.loginGitHub+'_toOmk');
                break;            
                default:
                    break;
            }
            hideLoader();
        }

        function setTable(idHot,data){
            let rectFooter = d3.select('footer').node().getBoundingClientRect(),
                rectHeader = d3.select('header').node().getBoundingClientRect(),
                h = hots.find(d=>d.id==idHot);
            if(data) h.data = data;
            let headers = Object.keys(h.data[0]),
                hot = new Handsontable(h.cont.append('div').node(), {
                    className: 'htDark',
                    afterGetColHeader: function(col, TH){
                        TH.className = 'darkTH'
                    },
                    colHeaders: true,
                    rowHeaders: true,
                    data:h.data,
                    colHeaders: headers,
                    height: rectFooter.top-rectFooter.height-rectHeader.bottom,
                    width: '100%',
                    licenseKey: 'non-commercial-and-evaluation',
                    customBorders: true,
                    dropdownMenu: true,
                    multiColumnSorting: true,
                    filters: true,
                    selectionMode:'single',
                    columns: getCellEditor(headers),
                    allowInsertColumn: false,
                    copyPaste: false,
                });

            

        }


    </script>
    
</body>
